# ============================================================
# 06 — Java GitLab Pipeline
# Maven compile → test → SonarQube → package → Nexus publish
# → Docker build → push to GitLab registry → deploy
# ============================================================

image: maven:3.9-eclipse-temurin-17

variables:
  MAVEN_OPTS: >-
    -Dhttps.protocols=TLSv1.2
    -Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository
    -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN
    -Dorg.slf4j.simpleLogger.showDateTime=true
  MAVEN_CLI_OPTS: >-
    --batch-mode
    --errors
    --fail-at-end
    --show-version
    -DinstallAtEnd=true
    -DdeployAtEnd=true

stages:
  - compile
  - test
  - quality
  - package
  - publish
  - containerise
  - deploy

# Cache .m2 repository across pipeline runs — huge speed improvement
cache:
  key:
    files:
      - pom.xml
  paths:
    - .m2/repository/

# ── STAGE: compile ────────────────────────────────────────
compile:
  stage: compile
  script:
    - mvn $MAVEN_CLI_OPTS compile
  artifacts:
    paths:
      - target/classes/
    expire_in: 1 hour

# ── STAGE: test ───────────────────────────────────────────
unit-test:
  stage: test
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    reports:
      junit:                            # GitLab parses and shows in MR
        - target/surefire-reports/TEST-*.xml
    paths:
      - target/surefire-reports/
    expire_in: 30 days
    when: always                        # Upload reports even if tests fail

# ── STAGE: quality ────────────────────────────────────────
sonarqube-analysis:
  stage: quality
  script:
    - mvn $MAVEN_CLI_OPTS verify sonar:sonar
        -Dsonar.projectKey=$CI_PROJECT_NAME
        -Dsonar.host.url=$SONAR_HOST_URL
        -Dsonar.token=$SONAR_TOKEN
        -Dsonar.gitlab.commit.sha=$CI_COMMIT_SHA
        -Dsonar.gitlab.ref_name=$CI_COMMIT_REF_NAME
  allow_failure: true                   # Don't block pipeline on quality gate failure during learning
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_MERGE_REQUEST_ID'

# ── STAGE: package ────────────────────────────────────────
package-jar:
  stage: package
  script:
    - mvn $MAVEN_CLI_OPTS package -DskipTests
    - echo "=== Built artifacts ==="
    - ls -lh target/*.jar
    - echo "JAR version: $(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
  artifacts:
    name: "$CI_PROJECT_NAME-$CI_COMMIT_SHORT_SHA"
    paths:
      - target/*.jar
    exclude:
      - target/original-*.jar           # Exclude the non-fat JAR
    expire_in: 30 days

# ── STAGE: publish ────────────────────────────────────────
publish-to-nexus:
  stage: publish
  script:
    - |
      if [ -z "$NEXUS_URL" ]; then
        echo "NEXUS_URL not set — skipping Nexus publish."
        echo "Set NEXUS_URL, NEXUS_USERNAME, NEXUS_PASSWORD in Project CI/CD Variables."
      else
        mvn $MAVEN_CLI_OPTS deploy
          -DskipTests
          -s $MAVEN_SETTINGS_XML
        echo "Published to Nexus: $NEXUS_URL"
      fi
  needs:
    - job: package-jar
      artifacts: true
    - job: unit-test
      artifacts: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── STAGE: containerise ───────────────────────────────────
docker-build-push:
  stage: containerise
  image: docker:24-cli
  services:
    - docker:24-dind               # Docker-in-Docker for building images
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
    IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $IMAGE_TAG -t $IMAGE_LATEST .
    - docker push $IMAGE_TAG
    - docker push $IMAGE_LATEST
    - echo "Pushed image: $IMAGE_TAG"
  needs:
    - job: package-jar
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ── STAGE: deploy ─────────────────────────────────────────
deploy-staging:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh deploy@$DEPLOY_HOST << SSHEOF
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        docker stop app-staging 2>/dev/null || true
        docker rm   app-staging 2>/dev/null || true
        docker run -d
          --name app-staging
          --restart unless-stopped
          -p 8080:8080
          $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        echo "Deployed $CI_COMMIT_SHORT_SHA to staging."
      SSHEOF
  environment:
    name: staging
    url: http://$DEPLOY_HOST:8080
  needs:
    - job: docker-build-push
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  stage: deploy
  image: alpine:3.19
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H $DEPLOY_HOST >> ~/.ssh/known_hosts
  script:
    - |
      ssh deploy@$DEPLOY_HOST << SSHEOF
        docker pull $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        docker stop app-production 2>/dev/null || true
        docker rm   app-production 2>/dev/null || true
        docker run -d
          --name app-production
          --restart unless-stopped
          -p 80:8080
          $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
        echo "Deployed $CI_COMMIT_SHORT_SHA to production."
      SSHEOF
  environment:
    name: production
    url: http://$DEPLOY_HOST
  needs:
    - job: docker-build-push
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual                   # Production deploys: tag push + human approval
