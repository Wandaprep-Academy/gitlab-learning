# .gitlab/templates/deploy.yml
# LOCAL include: - lives in the same repository.

.deploy-base:
  image: alpine:3.19
  before_script:
    - echo "Preparing deployment..."
    - echo "Deploying commit $CI_COMMIT_SHORT_SHA"
  environment:
    url: https://$DEPLOY_HOST

deploy-staging:
  extends: .deploy-base
  stage: deploy
  script:
    - echo "Deploying to STAGING..."
    - echo "Target: $DEPLOY_HOST"
  environment:
    name: staging
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

deploy-production:
  extends: .deploy-base
  stage: deploy
  script:
    - echo "Deploying to PRODUCTION..."
    - echo "Tag: $CI_COMMIT_TAG"
  environment:
    name: production
  rules:
    - if: '$CI_COMMIT_TAG'
      when: manual
