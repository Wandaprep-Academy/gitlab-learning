# .gitlab/templates/build.yml
# LOCAL include - lives in the same repository.
# Included by the root .gitlab-ci.yml via:
#
# include:
#   - local: .gitlab/templates/build.yml

# Hidden job (template)
.build-base:
  stage: build
  before_script:
    - echo "=== Build job starting ==="
    - echo "Commit $CI_COMMIT_SHORT_SHA"
    - echo "Bran
    - echo "Runner $CI_ch $CI_COMMIT_REF_NAME"RUNNER_DESCRIPTION"

# Actual build job
build-application:
  extends: .build-base
  script:
    - echo "Building application..."
    - mkdir -p dist
    - 'echo "{\"commit\"\"$CI_COMMIT_SHORT_SHA\",\"version\"\"$APP_VERSION\"}" > dist/build-info.json'
    - echo "Build complete."
  artifacts:
    name: "build-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 hour
