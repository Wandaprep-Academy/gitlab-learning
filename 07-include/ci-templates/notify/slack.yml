# ci-templates/notify/slack.yml
# Reusable Slack notification jobs.
# Projects must set SLACK_WEBHOOK as a masked CI/CD variable.

.slack-base:
  image: alpine:3.19
  before_script:
    - apk add --no-cache curl
  variables:
    SLACK_CHANNEL: "#ci-cd-alerts"

notify-success:
  extends: .slack-base
  stage: .post
  script:
    - |
      curl -s -X POST "$SLACK_WEBHOOK" \
        -H 'Content-type: application/json' \
        -d "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"text\": \":white_check_mark: *Pipeline passed* on \`$CI_PROJECT_NAME\`\",
          \"attachments\": [{
            \"color\": \"good\",
            \"fields\": [
              {\"title\": \"Branch\",    \"value\": \"$CI_COMMIT_REF_NAME\", \"short\": true},
              {\"title\": \"Commit\",    \"value\": \"$CI_COMMIT_SHORT_SHA\", \"short\": true},
              {\"title\": \"Triggered\", \"value\": \"$GITLAB_USER_LOGIN\",   \"short\": true},
              {\"title\": \"Pipeline\",  \"value\": \"$CI_PIPELINE_URL\",     \"short\": false}
            ]
          }]
        }"
  when: on_success
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

notify-failure:
  extends: .slack-base
  stage: .post
  script:
    - |
      curl -s -X POST "$SLACK_WEBHOOK" \
        -H 'Content-type: application/json' \
        -d "{
          \"channel\": \"$SLACK_CHANNEL\",
          \"text\": \":x: *Pipeline FAILED* on \`$CI_PROJECT_NAME\`\",
          \"attachments\": [{
            \"color\": \"danger\",
            \"fields\": [
              {\"title\": \"Branch\",    \"value\": \"$CI_COMMIT_REF_NAME\",  \"short\": true},
              {\"title\": \"Commit\",    \"value\": \"$CI_COMMIT_SHORT_SHA\",  \"short\": true},
              {\"title\": \"Failed Job\",\"value\": \"$CI_JOB_NAME\",         \"short\": true},
              {\"title\": \"Pipeline\",  \"value\": \"$CI_PIPELINE_URL\",     \"short\": false}
            ]
          }]
        }"
  when: on_failure
