# ci-templates/build/docker.yml
# Reusable Docker build + push job.
# In a real setup, this file lives in a SEPARATE GitLab project
# (e.g. org/shared-ci-templates) and is included via:
#
#   include:
#     - project: org/shared-ci-templates
#       ref: main
#       file: /ci-templates/build/docker.yml

.docker-build:
  image: docker:24-cli
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    IMAGE_LATEST: "$CI_REGISTRY_IMAGE:latest"
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
    - echo "Pushed $IMAGE_TAG"

# Concrete job that projects can override or use directly
docker-build-push:
  extends: .docker-build
  stage: containerise
